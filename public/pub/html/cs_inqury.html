<script>
	openPopSheet('sheet1');

	// btn-file 버튼을 클릭했을 때 attach-file-input 요소를 클릭
    $('.btn-file').on('click', function(e) {
        e.preventDefault(); // 버튼의 기본 동작(폼 제출 등)을 방지
        $(this).siblings('.attach-file-input').trigger('click');
    });

    // 파일이 선택되면 f-inp 입력 필드에 파일 이름 표시
    $('.attach-file-input').on('change', function() {
        var fileName = $(this).val().split('\\').pop(); // 파일 이름 추출
        $(this).siblings('.f-inp').val(fileName);
    });

	// textarea에 입력할 때마다 글자 수 업데이트
    $('#askCont').on('input', function() {
        var textLength = $(this).val().length; // 입력된 글자 수 계산
        $('.cnt-num').text(textLength); // cnt-num 요소에 글자 수 표시
    });
</script>
